<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crear cuenta · UniShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap bar">
        <a class="logo" href="login.html"><i data-icon="package" data-size="24"></i>UniShare</a>
      </div>
    </header>
    <main class="auth">
      <section class="box">
        <h1 class="t0">Crea tu cuenta</h1>
        <p class="mut">Solo para la comunidad universitaria (@unishare.edu.co).</p>
        <form id="form-registro" novalidate>
          <div data-errores></div>
          <div class="f">
            <label for="nombre">Nombre</label
            ><input id="nombre" name="nombre" autocomplete="name" />
          </div>
          <div class="f">
            <label for="email">Correo institucional</label
            ><input id="email" name="email" type="email" placeholder="tu.nombre@unishare.edu.co" />
          </div>
          <div class="f">
            <label for="rol">Soy</label
            ><select id="rol" name="rol">
              <option value="estudiante">Estudiante</option>
              <option value="profesor">Profesor</option>
            </select>
          </div>
          <div class="f">
            <label for="clave">Contraseña (mínimo 4 caracteres)</label
            ><input id="clave" name="clave" type="password" autocomplete="new-password" />
          </div>
          <button class="btn pri w">Crear cuenta</button>
        </form>
        <p class="mut">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </section>
    </main>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="js/iconos.js"></script>
    <script src="js/api.js"></script>
<script src="js/ui.js"></script>
    <script src="js/pages/auth.js"></script>
  </body>
</html>
